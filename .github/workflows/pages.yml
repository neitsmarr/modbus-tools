name: Deploy to GitHub Pages
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set base href for project site
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' ModbusTools/ModbusTools/wwwroot/index.html
      - name: Publish
        run: dotnet publish ModbusTools/ModbusTools/ModbusTools.csproj -c Release -o publish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
